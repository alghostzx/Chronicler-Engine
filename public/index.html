<!doctype html>
<html lang="pt-BR" class="theme-medieval mode-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronicler Engine</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica tema e modo salvos antes da primeira pintura (evita o "flash" claro/escuro).
      (function () {
        try {
          var mode = localStorage.getItem('chronicler.mode') || 'auto';
          var theme = localStorage.getItem('chronicler.theme') || 'medieval';
          var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var cl = document.documentElement.classList;
          cl.remove('theme-medieval', 'mode-light');
          cl.add('theme-' + theme, dark ? 'mode-dark' : 'mode-light');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="bg-main text-ink font-reading antialiased">
    <div id="app"></div>
    <div id="toasts" class="fixed right-4 top-4 z-[100] flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-2"></div>
    <noscript>Este aplicativo precisa de JavaScript.</noscript>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
