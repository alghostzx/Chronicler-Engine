services:
  chronicler:
    build: .
    image: chronicler-engine:latest
    container_name: chronicler-engine
    restart: unless-stopped
    ports:
      # Apenas loopback: a interface não tem autenticação e guarda a chave da API (§11.9).
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_PATH=/data/chronicler.db
      - PORT=3000
      - HOST=0.0.0.0
